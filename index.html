<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Deepak Saini - Skin Specialist</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f3f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .profile-card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 30, 80, 0.08);
      text-align: center;
    }

    /* Top Photo Banner Area */
    .image-container {
      background-color: #202b66;
      width: 100%;
      height: 290px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .doctor-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
      display: block;
    }

    /* Card Details */
    .content-container {
      padding: 24px 22px 28px 22px;
    }

    h1 {
      color: #0b498a;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .tagline {
      color: #0077b6;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .description {
      color: #475569;
      font-size: 12.5px;
      line-height: 1.55;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    /* Link Buttons */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 13px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14.5px;
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
      opacity: 0.95;
    }

    /* Custom Colors matching reference */
    .btn-instagram {
      background: linear-gradient(90deg, #ea580c 0%, #d946ef 50%, #7c3aed 100%);
    }

    .btn-facebook {
      background-color: #1877f2;
    }

    .btn-youtube {
      background-color: #ff0000;
    }

    .btn-review {
      background-color: #2e8540;
    }

    .btn-whatsapp {
      background-color: #22c55e;
    }

    .footer {
      margin-top: 22px;
      font-size: 11.5px;
      color: #64748b;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <!-- Top Cutout Frame -->
    <div class="image-container">
      <img src="doctor.png" alt="Dr. Deepak Saini" class="doctor-img">
    </div>

    <div class="content-container">
      <h1>Dr. Deepak Saini</h1>
      <div class="tagline">Care • Trust • Healing</div>
      <p class="description">
        Connect with Dr. Deepak Saini for appointments, health updates, patient reviews, and clinic information — all in one place.
      </p>

      <div class="button-group">
        <!-- 1. Instagram -->
        <a href="https://www.instagram.com/doctordeepaksaini" target="_blank" class="btn btn-instagram">
          Instagram
        </a>

        <!-- 2. Facebook -->
        <a href="https://www.facebook.com/DrDeepakSainiMD/" target="_blank" class="btn btn-facebook">
          Facebook
        </a>

        <!-- 3. YouTube -->
        <a href="https://www.youtube.com/channel/UCJBM0TrjTSetWiejkvpVAgA" target="_blank" class="btn btn-youtube">
          YouTube
        </a>

        <!-- 4. Google Review -->
        <a href="https://www.google.com/search?gs_ssp=eJzj4tVP1zc0LIpPTk82Ti82YLRSNagwtjQ3srQ0tzQ0STQwSzJLsTKoSLNMTU61MDRMMzMzNjVPNfFSTinSU0hJTS1IzFYoTszMy1TI1UvRU9Aozs7MU1BTKANyNAGZQRnx&q=dr.+deepak+saini+m.d.+(skin+%26+v.d.)#lrd=0x3972997914a06b6d:0xf9ece811f66357e4,1,,,," target="_blank" class="btn btn-review">
          Leave a Google Review
        </a>

        <!-- 5. WhatsApp Appointment -->
        <a href="https://wa.me/918233620891?text=Hello%20Dr.%20Deepak%20Saini,%20I%20want%20to%20book%20an%20appointment" target="_blank" class="btn btn-whatsapp">
          WhatsApp Appointment
        </a>
      </div>

      <div class="footer">
        Scan • Connect • Care
      </div>
    </div>
  </div>

</body>
</html>
